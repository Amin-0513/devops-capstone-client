services:
  client:
    build: .
    # CI/CD replaces this line with the exact tag it pushed (e.g. :sha-1a2b3c4)
    image: ${DOCKERHUB_USERNAME:-local}/devops-capstone-client:${IMAGE_TAG:-latest}
    container_name: client
    ports:
      - "8501:8501"
    environment:
      - SERVER_HOST=${SERVER_HOST:-server}
      - SERVER_PORT=${SERVER_PORT:-5000}
    volumes:
      - clientvol:/clientdata
    networks:
      - filenet
    restart: unless-stopped

volumes:
  clientvol:
    name: clientvol

networks:
  filenet:
    external: true