name: CI/CD - client

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "images/**", "AWS_qwen_image/**", "terraform/**", "monitoring/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push waits instead of cancelling a deploy halfway
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: client
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/devops-capstone-client

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile app.py

      - name: Work out image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to client VM
    needs: build
    # Never run pull requests (which may come from forks) on the private runner
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, client-vm]
    steps:
      - uses: actions/checkout@v4

      - name: Update image tag in Compose, pull and deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          HEALTH_CMD: curl -fsS http://localhost:8501/_stcore/health
        # SERVER_HOST / SERVER_PORT come from /etc/environment (written by Terraform)
        run: bash ci/deploy.sh

      - name: Show running containers
        if: always()
        run: docker ps --filter name=client --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

  notify:
    name: Slack notification
    needs: [build, deploy]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Send result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set, skipping"; exit 0; fi
          if [ "$BUILD" = success ] && [ "$DEPLOY" = success ]; then
            icon=":white_check_mark:"; status="succeeded"
          else
            icon=":x:"; status="failed (build: $BUILD, deploy: $DEPLOY)"
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          text="$icon *${APP_NAME}* deployment $status
          *Image:* \`${IMAGE}:${TAG:-n/a}\`
          *Commit:* <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA|${GITHUB_SHA::7}> ${COMMIT_MSG%%$'\n'*}
          *By:* $GITHUB_ACTOR  |  <$run_url|View run>"
          jq -n --arg text "$(echo "$text" | sed 's/^ *//')" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
